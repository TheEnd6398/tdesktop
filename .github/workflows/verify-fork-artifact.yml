name: Verify Windows fork package

on:
  push:
    branches:
      - feature/liquid-glass-ui
    paths:
      - .github/workflows/verify-fork-artifact.yml
      - Telegram/build/fork/verify-package.py
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Native build artifact ID (empty selects the latest successful fork build)
        required: false
        type: string
      publish_release:
        description: Publish the verified portable package as a public preview release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.package.outputs.source }}
      native_run: ${{ steps.package.outputs.native_run }}
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify the native package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, sys, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          def gh(*args):
              result = subprocess.run(['gh', *args], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError(f'GitHub request failed with exit code {result.returncode}.')
              return result.stdout
          requested = os.environ.get('ARTIFACT_ID', '')
          if requested:
              artifact = json.loads(gh('api', f'repos/{repo}/actions/artifacts/{int(requested)}'))
          else:
              runs = json.loads(gh('api', f'repos/{repo}/actions/workflows/fork-win-x64.yml/runs?branch=feature%2Fliquid-glass-ui&status=success&per_page=1'))
              run = runs['workflow_runs'][0]
              artifacts = json.loads(gh('api', f'repos/{repo}/actions/runs/{run["id"]}/artifacts'))
              artifact = next(a for a in artifacts['artifacts'] if not a['expired'] and a['name'].startswith('LiquidGlass-Windows-x64-'))
          commit = artifact['workflow_run']['head_sha']
          if artifact['expired'] or not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise RuntimeError('The selected artifact is expired or has invalid provenance.')
          if artifact['name'] != f'LiquidGlass-Windows-x64-{commit}':
              raise RuntimeError('Select an original native build artifact.')
          run_id = artifact['workflow_run']['id']
          native_run = json.loads(gh('api', f'repos/{repo}/actions/runs/{run_id}'))
          if native_run['conclusion'] != 'success' or native_run['head_sha'] != commit:
              raise RuntimeError('The native build did not succeed at the selected source commit.')
          gh('run', 'download', str(run_id), '--repo', repo, '--name', artifact['name'], '--dir', 'artifact-check')
          archive = pathlib.Path('artifact-check/LiquidGlass-Windows-x64.zip')
          with zipfile.ZipFile(archive) as package:
              binary_hash = hashlib.sha256(package.read('LiquidGlass/Telegram.exe')).hexdigest()
              needs_guide = 'LiquidGlass/IMPLEMENTATION.md' not in package.namelist()
              needs_provenance = 'LiquidGlass/BUILD-INFO.json' not in package.namelist()
          with zipfile.ZipFile(archive, 'a', compression=zipfile.ZIP_DEFLATED) as package:
              if needs_guide:
                  guide = json.loads(gh('api', f'repos/{repo}/contents/docs/fork/IMPLEMENTATION.md?ref={commit}'))
                  package.writestr('LiquidGlass/IMPLEMENTATION.md', base64.b64decode(guide['content']))
              if needs_provenance:
                  package.writestr('LiquidGlass/BUILD-INFO.json', json.dumps({
                      'source_commit': commit,
                      'native_build_run': run_id,
                      'native_build_artifact': artifact['id'],
                      'executable_sha256': binary_hash,
                      'verification_commit': os.environ['GITHUB_SHA'],
                      'verification_run': os.environ['GITHUB_RUN_ID'],
                  }, indent=2) + '\n')
          subprocess.run([sys.executable, 'Telegram/build/fork/verify-package.py', str(archive), '--commit', commit], check=True)
          report = json.loads(pathlib.Path('artifact-check/verification.json').read_text())
          if report['executable_sha256'] != binary_hash:
              raise RuntimeError('Packaging changed the native executable.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VERIFIED_SOURCE={commit}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'source={commit}\nnative_run={run_id}\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: LiquidGlass-Windows-x64-${{ env.VERIFIED_SOURCE }}-verified
          path: |
            artifact-check/LiquidGlass-Windows-x64.zip
            artifact-check/verification.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: LiquidGlass-Windows-x64-${{ needs.verify.outputs.source }}-verified
          path: release
      - name: Publish the verified portable preview
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source }}
          NATIVE_RUN: ${{ needs.verify.outputs.native_run }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise RuntimeError('Invalid verified source commit.')
          directory = pathlib.Path('release')
          archive = directory / 'LiquidGlass-Windows-x64.zip'
          report_file = directory / 'verification.json'
          report = json.loads(report_file.read_text())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if report['source_commit'] != commit or report['sha256'] != digest:
              raise RuntimeError('The release package does not match its verification report.')
          with zipfile.ZipFile(archive) as package:
              provenance = json.loads(package.read('LiquidGlass/BUILD-INFO.json'))
              binary_hash = hashlib.sha256(package.read('LiquidGlass/Telegram.exe')).hexdigest()
          if provenance['source_commit'] != commit or provenance['executable_sha256'] != binary_hash or report['executable_sha256'] != binary_hash:
              raise RuntimeError('The release executable does not match its build provenance.')
          checksums = directory / 'SHA256SUMS.txt'
          checksums.write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in (archive, report_file)))
          tag = f'liquid-glass-{commit[:10]}'
          notes = directory / 'release-notes.md'
          notes.write_text(
              'Portable Windows x64 preview with the Liquid Glass interface enabled by default.\n\n'
              'Download **LiquidGlass-Windows-x64.zip**, extract it into a new writable folder, '
              'and run **LiquidGlass/Start Liquid Glass.cmd**. The fork uses its own profile.\n\n'
              f'Source commit: `{commit}`.\n\n'
              f'[Successful native build and startup check](https://github.com/{repo}/actions/runs/{os.environ["NATIVE_RUN"]}). '
              'Package CRC, AMD64 images, branding, isolated launcher and source/executable provenance passed verification. '
              'This is the verified native build, without recompilation or changes to the executable.\n\n'
              f'Portable ZIP SHA-256: `{digest}`.\n\n'
              'Real-chat screenshots, interactive light/dark theme acceptance, narrow/RTL behavior and performance remain unverified. '
              f'See the [implementation and Windows acceptance matrix](https://github.com/{repo}/blob/{commit}/docs/fork/IMPLEMENTATION.md).\n')
          subprocess.run([
              'gh', 'release', 'create', tag, '--repo', repo, '--target', commit,
              '--title', f'Liquid Glass Windows x64 preview ({commit[:10]})',
              '--prerelease', '--latest=false', '--notes-file', str(notes),
              str(archive), str(report_file), str(checksums),
          ], check=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f'[Public portable download](https://github.com/{repo}/releases/download/{tag}/{archive.name})\n')
          PY
