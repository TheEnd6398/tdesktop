name: Fork Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/liquid-glass-ui

permissions:
  contents: read

concurrency:
  group: fork-win-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  FORK_TOOLSET: '14.44'
  FORK_SDK: '10.0.26100.0'
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  credentials:
    name: Check fork API secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require personal API credentials
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          missing=0
          for name in API_ID API_HASH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          exit "$missing"

  dependencies:
    name: Prepare x64 Release libraries
    needs: credentials
    runs-on: windows-latest
    timeout-minutes: 350
    outputs:
      cache-key: ${{ steps.identity.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild/tdesktop
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          sdk: ${{ env.FORK_SDK }}
          toolset: ${{ env.FORK_TOOLSET }}
      - name: Identify pinned library recipes
        id: identity
        shell: pwsh
        env:
          RECIPE_HASH: ${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py', 'TBuild/tdesktop/cmake/external/angle/qt.cmake') }}
        run: |
          "key=fork-win-x64-release-v1-${{ runner.os }}-${env:FORK_TOOLSET}-${env:FORK_SDK}-${env:RECIPE_HASH}" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: TBuild/ThirdParty
          key: ${{ steps.identity.outputs.key }}-tools
      - uses: actions/cache@v6
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/[qQ]t[_-]*
            !TBuild/Libraries/win64/cache_keys
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ steps.identity.outputs.key }}-libraries
      - uses: actions/cache@v6
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ steps.identity.outputs.key }}-qt
      - name: Prepare Debug and Release dependency configurations
        shell: cmd
        run: |
          git config --global user.name "Fork dependency builder"
          git config --global user.email "fork-build@users.noreply.github.com"
          call TBuild\tdesktop\Telegram\build\prepare\win.bat silent qt6

  build:
    name: Compile and package Windows x64
    needs: dependencies
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild/tdesktop
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          sdk: ${{ env.FORK_SDK }}
          toolset: ${{ env.FORK_TOOLSET }}
      - uses: actions/cache/restore@v6
        with:
          path: TBuild/ThirdParty
          key: ${{ needs.dependencies.outputs.cache-key }}-tools
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: |
            TBuild/Libraries/win64/*
            !TBuild/Libraries/win64/[qQ]t[_-]*
            !TBuild/Libraries/win64/cache_keys
            TBuild/Libraries/win64/cache_keys/*
            !TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ needs.dependencies.outputs.cache-key }}-libraries
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v6
        with:
          path: |
            TBuild/Libraries/win64/[qQ]t[_-]*
            TBuild/Libraries/win64/cache_keys/[qQ]t[_-]*
          key: ${{ needs.dependencies.outputs.cache-key }}-qt
          fail-on-cache-miss: true
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - name: Configure and build the fork
        shell: pwsh
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          set(TDESKTOP_API_ID "$ENV{API_ID}" CACHE STRING "Fork API id" FORCE)
          set(TDESKTOP_API_HASH "$ENV{API_HASH}" CACHE STRING "Fork API hash" FORCE)
          '@ | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/fork-api.cmake"
          Set-Location TBuild/tdesktop/Telegram
          & ./configure.bat -G 'Ninja Multi-Config' -C "$env:RUNNER_TEMP/fork-api.cmake" `
            -D CMAKE_CONFIGURATION_TYPES=Release `
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -D CMAKE_C_COMPILER_LAUNCHER=sccache `
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -D TDESKTOP_API_TEST=OFF `
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON `
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build ../out --config Release --target Telegram --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable application
        shell: pwsh
        run: |
          & TBuild/tdesktop/Telegram/build/fork/package-win.ps1 `
            -BuildDirectory TBuild/tdesktop/out/Release `
            -Destination artifact
      - uses: actions/upload-artifact@v7
        with:
          name: LiquidGlass-Windows-x64-${{ github.sha }}
          path: artifact/LiquidGlass-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
